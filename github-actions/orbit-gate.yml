# Orbit CLI 빌드 게이트 — GitHub Actions 샘플
#
# 실제 파이프라인에 적용하는 템플릿입니다.
#   Build → Tag → scan image → Push → scan promote
# 스텝은 서로의 출력(outputs)에 기대지 않습니다. 필요 없는 스텝은 지워도 나머지가 동작합니다.
# 단, Build·Tag는 판정할 이미지를 만드는 스텝이라 scan image·Push·Promote를 쓰는 동안 남겨 둡니다.
#
# 필요한 값: Variables에 ORBIT_CLIENT_ID, Secrets에 ORBIT_CLIENT_SECRET
#            REGISTRY_LOGIN이 credentials면 Variables에 REGISTRY_USERNAME, Secrets에 REGISTRY_TOKEN
name: build

on:
  push:
    branches: [main]

env:
  # ─── 여기만 바꿉니다 ───────────────────────────────────────────────────
  # 같은 이름의 Variables(Settings > Secrets and variables > Actions)로 넣으면 그 값을 씁니다.
  # 판정하고 올릴 이미지. 예: registry.example.com/team/myapp
  # 첫 부분(registry.example.com)이 레지스트리 주소이며, push와 로그인 모두 이 주소로 갑니다.
  # 시연: ttl.sh/orbit/orbit-gate-hello-<임의 문자열> + IMAGE_TAG 1h (자격 불필요, 공개됨)
  IMAGE: ${{ vars.IMAGE || '<레지스트리>/<네임스페이스>/<이름>' }}
  # 비우면 커밋 해시를 태그로 씁니다.
  IMAGE_TAG: ${{ vars.IMAGE_TAG || '' }}
  # 레지스트리 로그인. 둘 중 하나를 반드시 적습니다. 정하지 않으면 Push에서 멈춥니다.
  #   credentials : Variables의 REGISTRY_USERNAME, Secrets의 REGISTRY_TOKEN으로 로그인합니다.
  #   none        : 로그인하지 않습니다. ttl.sh나 이미 로그인된 러너일 때만 씁니다.
  REGISTRY_LOGIN: ${{ vars.REGISTRY_LOGIN || '<credentials 또는 none>' }}
  # ───────────────────────────────────────────────────────────────────────

  CANDIDATE_IMAGE: orbit-gate-candidate:local
  # CLI 2.0.1에 digest로 고정되어 있습니다. 다른 버전은 README 참고
  ORBIT_CLI_IMAGE: ghcr.io/oliveworks-io/orbit-cli:2.0.1@sha256:ce55fd53b389998ee2fa125ca6e5baf944384c1f9c56f5ff2c8e9bbe1e6aceca
  # CLI 컨테이너에 넘길 환경변수. 컨테이너는 러너의 환경변수를 물려받지 않습니다.
  ORBIT_ENV_ARGS: >-
    -e GITHUB_SERVER_URL -e GITHUB_REPOSITORY -e GITHUB_WORKFLOW_REF
    -e GITHUB_SHA -e GITHUB_RUN_ID
    -e ORBIT_CLIENT_ID -e ORBIT_CLIENT_SECRET

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 1) 푸시하지 않고 로컬에만 적재합니다.
      - name: Build (load only)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.CANDIDATE_IMAGE }}

      # 2) 최종 이미지 참조를 붙입니다(푸시 아님). IMAGE를 설정하지 않았으면 여기서 멈춥니다.
      - name: Tag with final ref
        run: |
          case "$IMAGE" in
            ''|*'<'*) echo "IMAGE를 설정하십시오. 예: registry.example.com/team/myapp / 시연: ttl.sh/orbit/orbit-gate-hello-<임의 문자열> (IMAGE_TAG=1h)"; exit 1 ;;
          esac
          docker tag "$CANDIDATE_IMAGE" "$IMAGE:${IMAGE_TAG:-$GITHUB_SHA}"

      # 3) 판정. 결과를 출력한 뒤, 통과가 아닌 모든 경우(차단, 오류)에 멈춥니다.
      - name: Orbit Security (scan image)
        env:
          ORBIT_CLIENT_ID: ${{ vars.ORBIT_CLIENT_ID }}
          ORBIT_CLIENT_SECRET: ${{ secrets.ORBIT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          REF="$IMAGE:${IMAGE_TAG:-$GITHUB_SHA}"
          # 플랫폼(아키텍처)을 손으로 적지 않습니다. buildx는 이 러너의 아키텍처로 만듭니다.
          PLATFORM="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$REF")"

          # 차단(exit 1)·오류(exit 2)에서 바로 끝나지 않도록 종료 코드를 직접 받습니다.
          # 차단 사유는 이 출력이 유일한 기록입니다.
          set +e
          docker run --rm $ORBIT_ENV_ARGS \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$ORBIT_CLI_IMAGE" \
            scan image "$REF" --platform "$PLATFORM" --details --format json \
            > gate.json
          GATE_EXIT=$?
          set -e
          if [ -s gate.json ]; then cat gate.json; else echo "(판정 응답 없음)"; fi
          [ "$GATE_EXIT" = "0" ] || { echo "게이트 차단/오류 (exit $GATE_EXIT)"; exit 1; }

      # 판정 결과를 보관합니다. 차단·오류여도 실행됩니다.
      - name: Upload gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-gate
          path: gate.json
          if-no-files-found: warn

      # 4) 판정한 그 이미지를 그대로 올립니다. REGISTRY_LOGIN에 따라 로그인하고, 로그인 호스트는 IMAGE에서 뽑습니다.
      - name: Push
        env:
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          REF="$IMAGE:${IMAGE_TAG:-$GITHUB_SHA}"
          case "$IMAGE" in ttl.sh/*) echo "경고: ttl.sh는 공개 임시 레지스트리입니다. 누구나 이 이미지를 받을 수 있습니다." ;; esac
          case "$REGISTRY_LOGIN" in
            credentials)
              [ -n "${REGISTRY_USERNAME:-}" ] && [ -n "${REGISTRY_TOKEN:-}" ] || { echo "REGISTRY_LOGIN=credentials인데 REGISTRY_USERNAME, REGISTRY_TOKEN이 없습니다"; exit 1; }
              HOST="${IMAGE%%/*}"
              case "$HOST" in *.*|*:*|localhost) ;; *) HOST=docker.io ;; esac
              echo "$REGISTRY_TOKEN" | docker login -u "$REGISTRY_USERNAME" --password-stdin "$HOST" ;;
            none) ;;
            *) echo "REGISTRY_LOGIN을 정하십시오. 자격으로 로그인하려면 credentials, 로그인하지 않으려면 none"; exit 1 ;;
          esac
          docker push "$REF"

      # 5) 확정 digest를 보고합니다. requestId는 gate.json에서, digest는 push된 이미지에서 직접 읽습니다.
      #    앞 스텝을 지워 값이 없으면 건너뜁니다.
      - name: Orbit Promote (scan promote)
        env:
          ORBIT_CLIENT_ID: ${{ vars.ORBIT_CLIENT_ID }}
          ORBIT_CLIENT_SECRET: ${{ secrets.ORBIT_CLIENT_SECRET }}
        run: |
          REF="$IMAGE:${IMAGE_TAG:-$GITHUB_SHA}"
          REQUEST_ID="$(grep -o '"requestId" *: *"[^"]*"' gate.json 2>/dev/null | head -n 1 | cut -d'"' -f4 || true)"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$REF" 2>/dev/null | cut -d'@' -f2 || true)"
          [ -n "$REQUEST_ID" ] || { echo "gate.json에 requestId가 없어 보고하지 않습니다"; exit 0; }
          [ -n "$DIGEST" ]     || { echo "push된 digest가 없어 보고하지 않습니다"; exit 0; }
          docker run --rm $ORBIT_ENV_ARGS "$ORBIT_CLI_IMAGE" \
            scan promote --request-id "$REQUEST_ID" --image-digest "$DIGEST"
