# Orbit CLI 빌드 게이트 — GitHub Actions 샘플
#
# 기존 워크플로의 체크아웃 단계 뒤에 아래 스텝을 끼워 넣습니다.
# 사용 전에 아래 값을 환경에 맞게 바꿉니다.
#   IMAGE           : 배포할 이미지 이름(레지스트리 포함)
#   ORBIT_CLI_IMAGE : <64자 hex> 자리에 확인한 digest를 넣습니다.
# 필요한 값: 저장소(또는 조직)의 Variables에 ORBIT_CLIENT_ID,
#            Secrets에 ORBIT_CLIENT_SECRET
name: build

on:
  push:
    branches: [main]

env:
  IMAGE: registry.example.com/team/myapp
  CANDIDATE_IMAGE: myapp:candidate
  ORBIT_CLI_IMAGE: ghcr.io/oliveworks-io/orbit-cli:2.0.0@sha256:<64자 hex>

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 1) 푸시하지 않고 로컬에만 적재합니다.
      - name: Build (load only)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.CANDIDATE_IMAGE }}

      # 2) 최종 이미지 참조를 붙입니다(푸시 아님).
      - name: Tag with final ref
        id: ref
        run: |
          set -euo pipefail
          REF="${{ env.IMAGE }}:${{ github.sha }}"
          docker tag "$CANDIDATE_IMAGE" "$REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      # 3) 판정을 받습니다. 통과가 아니면 여기서 멈춥니다.
      - name: Orbit Security
        id: gate
        env:
          ORBIT_CLIENT_ID: ${{ vars.ORBIT_CLIENT_ID }}
          ORBIT_CLIENT_SECRET: ${{ secrets.ORBIT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          REF="${{ steps.ref.outputs.ref }}"
          # 플랫폼(아키텍처)을 손으로 적지 않습니다. buildx는 이 러너의 아키텍처로 만듭니다.
          PLATFORM="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$REF")"

          docker run --rm \
            -e GITHUB_SERVER_URL -e GITHUB_REPOSITORY -e GITHUB_WORKFLOW_REF \
            -e GITHUB_SHA -e GITHUB_RUN_ID \
            -e ORBIT_CLIENT_ID -e ORBIT_CLIENT_SECRET \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$ORBIT_CLI_IMAGE" \
            scan image "$REF" \
              --platform "$PLATFORM" \
              --details --format json \
            > gate.json
          cat gate.json

          # 다음 스텝(Promote)에서 쓸 requestId를 저장합니다.
          REQUEST_ID="$(grep -o '"requestId" *: *"[^"]*"' gate.json | head -n 1 | cut -d'"' -f4 || true)"
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"

      # 4) 판정한 그 이미지를 그대로 올립니다.
      - name: Push
        id: push
        run: |
          set -euo pipefail
          REF="${{ steps.ref.outputs.ref }}"
          docker push "$REF"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$REF" | cut -d'@' -f2)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # 5) 선택: 확정된 digest를 보고해 런타임 이미지와 연결합니다.
      - name: Promote
        env:
          ORBIT_CLIENT_ID: ${{ vars.ORBIT_CLIENT_ID }}
          ORBIT_CLIENT_SECRET: ${{ secrets.ORBIT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          REQUEST_ID="${{ steps.gate.outputs.request_id }}"
          DIGEST="${{ steps.push.outputs.digest }}"
          if [ -z "$REQUEST_ID" ] || [ -z "$DIGEST" ]; then
            echo "requestId 또는 digest를 확인하지 못해 보고하지 않습니다"
            exit 0
          fi
          docker run --rm \
            -e ORBIT_CLIENT_ID -e ORBIT_CLIENT_SECRET \
            "$ORBIT_CLI_IMAGE" \
            scan promote --request-id "$REQUEST_ID" --image-digest "$DIGEST"
