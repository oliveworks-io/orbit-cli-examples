# Orbit CLI 빌드 게이트 — GitLab CI 샘플
#
# 기존 빌드 잡에 단계를 끼워 넣는 예입니다. 빌드와 게이트는 한 잡에 둡니다.
# (dind 서비스는 잡 단위라 잡을 나누면 만든 이미지가 사라집니다.)
# 사용 전에 아래 값을 환경에 맞게 바꿉니다.
#   ORBIT_CLI_IMAGE : <64자 hex> 자리에 확인한 digest를 넣습니다.
# 필요한 CI/CD 변수: ORBIT_CLIENT_ID, ORBIT_CLIENT_SECRET (Masked 권장)
variables:
  IMAGE: $CI_REGISTRY_IMAGE
  CANDIDATE_IMAGE: myapp:candidate
  ORBIT_CLI_IMAGE: ghcr.io/oliveworks-io/orbit-cli:2.0.0@sha256:<64자 hex>
  # dind를 쓰는 경우에만 아래 세 줄이 필요합니다.
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

build_and_gate:
  image: docker:27-cli
  services:
    - docker:27-dind          # dind 구성에서만
  script:
    # 1) 푸시하지 않고 로컬에만 적재합니다.
    - docker build -t "$CANDIDATE_IMAGE" .

    # 2) 최종 이미지 참조를 붙입니다(푸시 아님).
    - |
      REF="$IMAGE:$CI_COMMIT_SHA"
      docker tag "$CANDIDATE_IMAGE" "$REF"
      echo "$REF" > /tmp/orbit-ref

    # 3) 판정을 받습니다.
    - |
      REF="$(cat /tmp/orbit-ref)"
      # 도커 소켓의 그룹 ID는 컨테이너를 띄워서 측정합니다.
      SOCK_GID="$(docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
        alpine:3 stat -c '%g' /var/run/docker.sock)"
      # 플랫폼(아키텍처)을 손으로 적지 않습니다. 빌드는 이 러너의 아키텍처로 만들어집니다.
      PLATFORM="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$REF")"
      set +e
      docker run --rm \
        -e CI_SERVER_HOST -e CI_SERVER_URL -e CI_PROJECT_PATH -e CI_CONFIG_PATH \
        -e CI_COMMIT_SHA -e CI_PIPELINE_ID \
        -e ORBIT_CLIENT_ID -e ORBIT_CLIENT_SECRET \
        --group-add "$SOCK_GID" \
        -v /var/run/docker.sock:/var/run/docker.sock \
        "$ORBIT_CLI_IMAGE" \
        scan image "$REF" \
          --platform "$PLATFORM" \
          --details --format json \
        > gate.json
      echo $? > /tmp/orbit-exit
      set -e
      if [ -s gate.json ]; then cat gate.json; else echo "(판정 응답 없음)"; fi

    # 4) 통과가 아니면 중단합니다. 오류(2)도 통과가 아닙니다.
    - |
      GATE_EXIT="$(cat /tmp/orbit-exit)"
      [ "$GATE_EXIT" = "0" ] || { echo "게이트 차단/오류 (exit $GATE_EXIT)"; exit 1; }

    # 5) 판정한 그 이미지를 그대로 올립니다.
    - docker push "$(cat /tmp/orbit-ref)"

    # 6) 선택: 확정된 digest를 보고해 런타임 이미지와 연결합니다.
    - |
      REF="$(cat /tmp/orbit-ref)"
      REQUEST_ID="$(grep -o '"requestId" *: *"[^"]*"' gate.json | head -n 1 | cut -d'"' -f4 || true)"
      IMAGE_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$REF" | cut -d'@' -f2)"
      if [ -n "$REQUEST_ID" ] && [ -n "$IMAGE_DIGEST" ]; then
        docker run --rm \
          -e ORBIT_CLIENT_ID -e ORBIT_CLIENT_SECRET \
          "$ORBIT_CLI_IMAGE" \
          scan promote --request-id "$REQUEST_ID" --image-digest "$IMAGE_DIGEST"
      else
        echo "requestId 또는 digest를 확인하지 못해 보고하지 않습니다"
      fi
  artifacts:
    when: always
    paths: [gate.json]
