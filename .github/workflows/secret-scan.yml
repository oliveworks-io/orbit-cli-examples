name: secret-scan

# 이 저장소는 공개 저장소이므로 모든 push와 PR에서 인증 정보 유출을 검사합니다.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 이력을 검사합니다.
          persist-credentials: false

      # gitleaks-action은 조직 계정에서 라이선스 키가 필요하므로 공식 이미지를 직접 실행합니다.
      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            detect --source /repo --config /repo/.gitleaks.toml \
            --redact --verbose --no-banner
